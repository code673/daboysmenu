<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daboy's Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Daboy's</h1>
                <p class="tagline">Culinary Excellence</p>
            </div>
        </header>

        <!-- Category Filter -->
        <div class="filter-section">
            <div class="filter-header">
                <h3>Browse Our Menu</h3>
                <p class="filter-subtitle">Select a category</p>
            </div>
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All Items</button>
                <button class="filter-btn" data-category="beverages">Beverages</button>
                <button class="filter-btn" data-category="snacks">Snacks</button>
                <button class="filter-btn" data-category="desserts">Desserts</button>
                <button class="filter-btn" data-category="meals">Main Courses</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-section">
            <h2>Available Products</h2>
            <div class="products-grid" id="productsContainer">
                <!-- Products will be loaded here by JavaScript -->
                <div class="loading">Loading products...</div>
            </div>
        </div>

        <!-- No Products Message -->
        <div id="noProducts" class="no-products" style="display: none;">
            <p>No products available in this category.</p>
        </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Order Product</h2>
            <form id="purchaseForm" onsubmit="submitPurchase(event)">
                <div class="form-group">
                    <label for="productModalName">Product</label>
                    <input type="text" id="productModalName" readonly>
                </div>

                <div class="form-group">
                    <label for="customerName">Your Name *</label>
                    <input type="text" id="customerName" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="quantityInput">Quantity *</label>
                    <div class="quantity-input-group">
                        <button type="button" class="qty-btn" onclick="decrementQty()">-</button>
                        <input type="number" id="quantityInput" value="1" min="1" required onchange="updateTotal()" oninput="updateTotal()">
                        <button type="button" class="qty-btn" onclick="incrementQty()">+</button>
                    </div>
                    <small id="stockInfo"></small>
                </div>

                <div class="form-group">
                    <label>Price per Unit</label>
                    <input type="text" id="pricePerUnit" readonly>
                </div>

                <div class="form-group total-price">
                    <label>Total Price</label>
                    <input type="text" id="totalPrice" readonly>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Place Order</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize customer menu on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadCustomerMenu();
            setupCategoryFilters();
        });
    </script>
</body>
</html>
